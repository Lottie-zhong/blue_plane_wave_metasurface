    y_nm: 85.0
    frac_x: 0.75
    frac_y: 0.75
  nanopillar_2:
    length_nm: 85
    width_nm: 150
    rotation_deg: 112.5
    x_nm: -85.0
    y_nm: -85.0
    frac_x: 0.25
    frac_y: 0.25
