    branch while keeping period and helper geometry fixed.
  source_plan_csv: outputs/apcd_k6_active_learning/combined_phase_knob_p70_remaining_missing_bin_candidate_plan.csv
  source_selection_csv: outputs/apcd_k6_active_learning/combined_phase_knob_p70_remaining_missing_bin_fdtd_selection.csv
